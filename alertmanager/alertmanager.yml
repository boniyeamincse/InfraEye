global:
  smtp_smarthost: '${SMTP_HOST:-localhost:587}'
  smtp_from: '${SMTP_FROM:-alertmanager@example.org}'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASS}'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      routes:
        - match:
            team: devops
          receiver: 'devops-critical'
    - match:
        severity: warning
      receiver: 'warning'
    - match:
        severity: info
      receiver: 'info'

receivers:
  - name: 'default'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.summary }}'
        color: 'danger'
        fields:
          - title: 'Severity'
            value: '{{ .Labels.severity }}'
          - title: 'Instance'
            value: '{{ .Labels.instance }}'

  - name: 'critical'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts-critical'
        send_resolved: true
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        color: 'danger'
    email_configs:
      - to: '${EMAIL_RECIPIENTS:-admin@example.com}'
        subject: 'CRITICAL Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ .CommonAnnotations.summary }}

          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
          Description: {{ .CommonAnnotations.description }}

          {{ .ExternalURL }}

  - name: 'warning'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts-warning'
        send_resolved: true
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        color: 'warning'

  - name: 'info'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts-info'
        send_resolved: false
        title: 'ℹ️ INFO: {{ .GroupLabels.alertname }}'
        color: 'good'

  - name: 'devops-critical'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: '{{ .CommonAnnotations.summary }}'
        severity: 'critical'
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: '${TELEGRAM_CHAT_ID}'
        message: |
          🚨 *CRITICAL ALERT* 🚨
          {{ .GroupLabels.alertname }}

          {{ .CommonAnnotations.summary }}

          Severity: {{ .Labels.severity }}
          Instance: {{ .Labels.instance }}
        parse_mode: 'Markdown'

  - name: 'webhook'
    webhook_configs:
      - url: '${WEBHOOK_URL:-http://remediation-service:8080/webhook}'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'instance']