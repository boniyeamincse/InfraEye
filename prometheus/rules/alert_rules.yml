groups:
  - name: infraeye_alerts
    rules:
      # Node Exporter Alerts
      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.instance }} is down"
          description: "Node {{ $labels.instance }} has been down for more than 5 minutes."

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}%"

      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}%"

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space available: {{ $value }}%"

      - alert: DiskWillFill
        expr: predict_linear(node_filesystem_avail_bytes[6h], 3600*4) < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Disk will fill in 4 hours on {{ $labels.instance }}"
          description: "Disk on {{ $labels.instance }} will fill in approximately 4 hours"

      # Prometheus Alerts
      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus is down"
          description: "Prometheus has been down for more than 1 minute."

      - alert: PrometheusRestarted
        expr: prometheus_tsdb_head_series < prometheus_tsdb_head_series offset 5m
        for: 0s
        labels:
          severity: info
        annotations:
          summary: "Prometheus restarted"
          description: "Prometheus has restarted within the last 5 minutes."

      # Blackbox Exporter Alerts
      - alert: ProbeFailed
        expr: probe_success == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Probe failed for {{ $labels.instance }}"
          description: "Probe for {{ $labels.instance }} has failed."

      - alert: SlowProbe
        expr: probe_duration_seconds > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow probe response for {{ $labels.instance }}"
          description: "Probe duration for {{ $labels.instance }} is {{ $value }} seconds."

      # Postgres Exporter Alerts (if available)
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database has been down for more than 1 minute."

      - alert: HighPostgresConnections
        expr: pg_stat_activity_count > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High PostgreSQL connection count"
          description: "PostgreSQL has {{ $value }} active connections."

      # Alertmanager Alerts
      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager is down"
          description: "Alertmanager has been down for more than 1 minute."

      # Security Exporter Alerts
      - alert: SecurityExporterDown
        expr: up{job="security"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Security Exporter is down"
          description: "Security Exporter has been down for more than 1 minute."

      - alert: UnauthorizedPortChange
        expr: infraeye_security_ports_added > 0 or infraeye_security_ports_removed > 0
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Port changes detected"
          description: "Port changes detected: {{ $value }} ports added/removed"

      - alert: HighFailedLoginAttempts
        expr: increase(infraeye_security_failed_logins[5m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High number of failed login attempts"
          description: "More than 5 failed login attempts in the last 5 minutes"

      - alert: UnusualNetworkConnections
        expr: infraeye_security_network_connections > 100
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High number of network connections"
          description: "More than 100 established network connections detected"